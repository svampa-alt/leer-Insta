name: Leer reel de Instagram
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: URL pública del reel
        required: true
        default: https://www.instagram.com/reel/Dfj2-pFSzzt/
jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade yt-dlp faster-whisper
      - name: Descargar y transcribir
        env:
          REEL_URL: ${{ inputs.url || 'https://www.instagram.com/reel/Dfj2-pFSzzt/' }}
        shell: bash
        run: |
          mkdir -p resultado
          set +e
          yt-dlp --no-playlist --write-info-json --write-description --restrict-filenames -o 'resultado/reel.%(ext)s' "$REEL_URL" > resultado/descarga.log 2>&1
          status=$?
          echo "Código de descarga: $status" >> resultado/descarga.log
          if [ "$status" -ne 0 ]; then
            echo "No se pudo descargar el reel. Revisar descarga.log" > resultado/estado.txt
            exit 0
          fi
          ffmpeg -y -i "$(find resultado -maxdepth 1 -name 'reel.*' ! -name '*.json' ! -name '*.description' | head -n 1)" -vn -ac 1 -ar 16000 resultado/audio.wav > resultado/ffmpeg.log 2>&1
          if [ "$?" -ne 0 ]; then
            echo "Descargado, pero falló la extracción de audio." > resultado/estado.txt
            exit 0
          fi
          python - <<'PY'
          from faster_whisper import WhisperModel
          model = WhisperModel("small", device="cpu", compute_type="int8")
          segments, info = model.transcribe("resultado/audio.wav", beam_size=3, vad_filter=True)
          with open("resultado/transcripcion.txt", "w", encoding="utf-8") as f:
              for segment in segments:
                  f.write(f"[{segment.start:.1f}-{segment.end:.1f}] {segment.text.strip()}\n")
          with open("resultado/estado.txt", "w") as f:
              f.write(f"Transcripción completada. Idioma detectado: {info.language}\n")
          PY
          rm -f resultado/audio.wav
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-resultado
          path: resultado/
          retention-days: 7
