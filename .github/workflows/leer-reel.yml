name: Leer reel de Instagram
on:
  push:
    branches: [main]
    paths-ignore:
      - "transcripciones/**"
  workflow_dispatch:
    inputs:
      url:
        description: URL pública del reel
        required: true
        default: https://www.instagram.com/reel/DeaMWiwt-OM/
jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade yt-dlp faster-whisper
      - name: Descargar y transcribir
        env:
          REEL_URL: ${{ inputs.url || 'https://www.instagram.com/reel/DeaMWiwt-OM/' }}
        shell: bash
        run: |
          mkdir -p resultado
          set -e
          yt-dlp --no-playlist --write-info-json --write-description --restrict-filenames -o 'resultado/reel.%(ext)s' "$REEL_URL" > resultado/descarga.log 2>&1
          status=$?
          echo "Código de descarga: $status" >> resultado/descarga.log
          if [ "$status" -ne 0 ]; then
            echo "No se pudo descargar el reel. Revisar descarga.log" > resultado/estado.txt
            exit 1
          fi
          ffmpeg -y -i "$(find resultado -maxdepth 1 -name 'reel.*' ! -name '*.json' ! -name '*.description' | head -n 1)" -vn -ac 1 -ar 16000 resultado/audio.wav > resultado/ffmpeg.log 2>&1
          if [ "$?" -ne 0 ]; then
            echo "Descargado, pero falló la extracción de audio." > resultado/estado.txt
            exit 1
          fi
          python - <<'PY'
          import wave
          import numpy as np
          from faster_whisper import WhisperModel
          model = WhisperModel("small", device="cpu", compute_type="int8")
          with wave.open("resultado/audio.wav", "rb") as wav:
              audio = np.frombuffer(wav.readframes(wav.getnframes()), dtype=np.int16).astype(np.float32) / 32768.0
          segments, info = model.transcribe(audio, beam_size=3, vad_filter=True)
          with open("resultado/transcripcion.txt", "w", encoding="utf-8") as f:
              for segment in segments:
                  f.write(f"[{segment.start:.1f}-{segment.end:.1f}] {segment.text.strip()}\n")
          with open("resultado/estado.txt", "w") as f:
              f.write(f"Transcripción completada. Idioma detectado: {info.language}\n")
          PY
          test -s resultado/transcripcion.txt || { echo "Transcripción ausente o vacía" >&2; exit 1; }
          rm -f resultado/audio.wav
      - name: Publicar transcripción en repositorio
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s resultado/transcripcion.txt ]; then
            mkdir -p transcripciones
            cp resultado/transcripcion.txt transcripciones/DeaMWiwt-OM.txt
            git init -q
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git fetch -q origin main
            git checkout -q -B main FETCH_HEAD
            mkdir -p transcripciones
            cp resultado/transcripcion.txt transcripciones/DeaMWiwt-OM.txt
            git add transcripciones/DeaMWiwt-OM.txt
            git commit -m "Guardar transcripción del reel" || exit 0
            git push origin main
          fi
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-resultado
          path: resultado/
          retention-days: 7
